        function tinhTong(a,b){
            if(isNaN(a) == false && isNaN(b) == false){
                document.write(a+b);
            }
        }
        var soThuNhat = prompt("Nhap so thu 1", "");
        var soThuHai = prompt("Nhap so thu 2", "");
        tinhTong(soThuNhat, sothuHai);
        document.write(tinhTong(soThuNhat.soThuHai));

    </script>
