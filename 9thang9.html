<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p.nhom{
            color: red;
        }
        p{
            color: blue;
        }
        .khoi1{
            background-color: green;
        }

        .khoi2{
            background-color: yellow;
            /*1 gia tri: cach xung quanh = gia tri do */
            /*2 gia tri: gia tri dau tien (tren duoi) gia tri thu 2 (trai phai) */
            /*4 gia tri: theo thu tu (tren phai duoi trai-kim dong ho)*/
            margin: 50px 200px 10px 100px;
            /*cach dung tuong tu margin*/
            padding: 50px;
        }
        .khoi3{
            background-color: red;
        }
        .khoi4{
            background-color: grey;
            display: flex;
        }
        .khoi5{
            background-color: orange;
            width: 50%;
        }
        .khoi6{
            background-color: aqua;
            width: 50%;
        }
    </style>
</head>
<body>
    <p class="nhom">Nhom 3</p>
    <p>truong mo dia chat</p>

    <div class="khoi1">Khoi 1</div>
    <div class="khoi2">Khoi 2</div>
    <div class="khoi3">Khoi 3</div>
<br>
    <div class="khoi4">
       <div class="khoi5">Khoi 5</div>
       <div class="khoi6">Khoi 6</div>
    </div>
</body>
</html>
